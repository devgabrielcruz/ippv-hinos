<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Salmos, Cânticos e Hinos</title>
  <meta name="theme-color" content="#16100c">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5.5v13a.5.5 0 0 1-.8.4L10 12.4a.5.5 0 0 1 0-.8l9.2-6.5a.5.5 0 0 1 .8.4z"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5.5v13a.5.5 0 0 0 .8.4L14 12.4a.5.5 0 0 0 0-.8L4.8 5.1a.5.5 0 0 0-.8.4z"/></symbol>
      <symbol id="i-cross" viewBox="0 0 24 24" fill="currentColor"><path d="M10.5 2h3v5H19v3h-5.5v12h-3V10H5V7h5.5z"/></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
      <symbol id="i-repeat-one" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
    </defs>
  </svg>

  <div class="grain" aria-hidden="true"></div>
  <p class="visually-hidden" id="live" role="status" aria-live="polite"></p>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Playlist">
      <header class="sidebar__head">
        <span class="sheet-handle" aria-hidden="true"></span>
        <button class="btn-icon sheet-close" id="sheetClose" type="button" aria-label="Fechar playlist" title="Fechar">
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
        <div class="church church--side">
          <img class="church__logo" src="assets/logo.png" alt="" width="54" height="68">
          <p class="church__name"><span>Igreja Presbiteriana</span><strong>Pedras Vivas</strong></p>
        </div>
        <h1 class="sidebar__title" id="plTitle"></h1>
        <p class="sidebar__count" id="plCount"></p>
        <div class="search">
          <svg class="icon search__icon" aria-hidden="true"><use href="#i-search"/></svg>
          <input class="search__input" id="search" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" spellcheck="false" placeholder="Pesquisar música…" aria-label="Pesquisar na playlist">
          <button class="btn-icon search__clear" id="searchClear" type="button" aria-label="Limpar pesquisa" title="Limpar" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
          </button>
        </div>
      </header>
      <ol class="tracks" id="tracks"></ol>
      <div class="empty" id="emptySearch" hidden>
        <p class="empty__title">Nenhuma música encontrada</p>
        <p class="empty__text">Não há resultados para “<span id="emptyQuery"></span>”.</p>
        <button class="btn-text" id="emptyClear" type="button">Limpar pesquisa</button>
      </div>
    </aside>

    <div class="scrim" id="scrim" aria-hidden="true"></div>

    <main class="stage" id="stage">
      <div class="ambient" aria-hidden="true"><div class="ambient__img" id="ambientImg"></div></div>
      <div class="stage__inner">
        <div class="church church--top">
          <img class="church__logo" src="assets/logo.png" alt="" width="34" height="43">
          <p class="church__name"><span>Igreja Presbiteriana</span><strong>Pedras Vivas</strong></p>
        </div>
        <div class="frame" id="frame">
          <div class="frame__video">
            <div id="yt"></div>
            <div class="overlay" id="overlay" data-mode="boot">
              <div class="overlay__panel">
                <span class="spinner" aria-hidden="true"></span>
                <svg class="icon overlay__cross" aria-hidden="true"><use href="#i-cross"/></svg>
                <h2 class="overlay__title" id="ovTitle"></h2>
                <p class="overlay__text" id="ovText"></p>
                <div class="overlay__actions">
                  <button class="btn-text" id="ovOpenList" type="button" data-show="idle">Abrir playlist</button>
                  <button class="btn-text" id="ovRestart" type="button" data-show="ended">Ouvir novamente</button>
                  <button class="btn-text" id="ovSkip" type="button" data-show="error-player">Pular para a próxima</button>
                  <a class="btn-text" id="ovYoutube" target="_blank" rel="noopener noreferrer" data-show="error-player">Abrir no YouTube</a>
                  <button class="btn-text" id="ovRetry" type="button" data-show="error-api">Tentar novamente</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <section class="now" id="now" aria-labelledby="nowTitle" data-status="idle">
          <p class="now__eyebrow"><span class="now__dot" aria-hidden="true"></span><span id="nowStatus"></span></p>
          <h2 class="now__title" id="nowTitle"></h2>
          <p class="now__meta" id="nowMeta"></p>
        </section>

        <div class="progress">
          <span class="progress__time" id="timeCur">0:00</span>
          <input class="range" id="seek" type="range" min="0" max="1000" step="10" value="0" aria-label="Progresso da música" disabled>
          <span class="progress__time" id="timeDur">0:00</span>
        </div>

        <div class="controls">
          <button class="btn-text controls__list" id="openPlaylist" type="button" aria-controls="sidebar">
            <svg class="icon" aria-hidden="true"><use href="#i-list"/></svg><span>Ver playlist</span>
          </button>
          <div class="controls__main" role="group" aria-label="Controles de reprodução">
            <button class="btn-icon btn-toggle" id="shuffle" type="button" aria-pressed="false" aria-label="Reprodução aleatória" title="Aleatório">
              <svg class="icon"><use href="#i-shuffle"/></svg>
            </button>
            <button class="btn-icon" id="prev" type="button" aria-label="Música anterior" title="Anterior (←)">
              <svg class="icon"><use href="#i-prev"/></svg>
            </button>
            <button class="btn-play" id="play" type="button" aria-label="Tocar" title="Tocar (Espaço)">
              <svg class="icon"><use id="playIcon" href="#i-play"/></svg>
            </button>
            <button class="btn-icon" id="next" type="button" aria-label="Próxima música" title="Próxima (→)">
              <svg class="icon"><use href="#i-next"/></svg>
            </button>
            <button class="btn-icon btn-toggle" id="repeat" type="button" aria-label="Repetir: desligado" title="Repetir" data-state="off">
              <svg class="icon"><use id="repeatIcon" href="#i-repeat"/></svg>
            </button>
          </div>
          <div class="controls__extra">
            <div class="volume">
              <button class="btn-icon" id="mute" type="button" aria-label="Silenciar" title="Silenciar">
                <svg class="icon"><use id="muteIcon" href="#i-volume"/></svg>
              </button>
              <input class="range" id="volume" type="range" min="0" max="100" step="5" value="80" aria-label="Volume">
            </div>
            <button class="btn-icon" id="fullscreen" type="button" aria-label="Tela cheia" title="Tela cheia">
              <svg class="icon"><use href="#i-expand"/></svg>
            </button>
          </div>
        </div>

        <div class="ornament" aria-hidden="true"><svg class="icon"><use href="#i-cross"/></svg></div>

        <figure class="verse">
          <blockquote>
            <p>A palavra de Cristo habite em vós abundantemente, em toda a sabedoria, ensinando-vos e admoestando-vos uns aos outros, com salmos, hinos e cânticos espirituais, cantando ao Senhor com graça em vossos corações.</p>
          </blockquote>
          <figcaption>Colossenses 3:16</figcaption>
        </figure>
      </div>
    </main>
  </div>

  <noscript><p style="position:fixed;inset:0;display:grid;place-items:center;background:#16100c;color:#f1e6d0;font-family:serif;padding:2rem;text-align:center">Esta página precisa de JavaScript para reproduzir a playlist.</p></noscript>

  <script src="data/playlist.js" defer></script>
  <script src="js/youtube-url.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/player.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
